<!-- The mark for the "at sea" pin group. Drawn here rather than taken from
     anyone's brand: every other logo in this folder is an institution's own
     mark, used to identify it, and a shipping line's would be neither mine
     to use nor recognisable to a reader. A sail over two waves says the
     same thing and belongs to this page. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="At sea">
  <!-- Mast and sail -->
  <path d="M11.4 3.2 19 13.4h-7.6z" fill="#7a1710"/>
  <path d="M10.2 4.6v9.2" stroke="#7a1710" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M10.2 13.8h-4l1.6-3.4h2.4z" fill="#7a1710"/>
  <!-- Water -->
  <path d="M3 17.4c1.5 0 1.5 1.3 3 1.3s1.5-1.3 3-1.3 1.5 1.3 3 1.3 1.5-1.3 3-1.3 1.5 1.3 3 1.3 1.5-1.3 3-1.3" fill="none" stroke="#7a1710" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M3 20.6c1.5 0 1.5 1.3 3 1.3s1.5-1.3 3-1.3 1.5 1.3 3 1.3 1.5-1.3 3-1.3 1.5 1.3 3 1.3 1.5-1.3 3-1.3" fill="none" stroke="#7a1710" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
</svg>
