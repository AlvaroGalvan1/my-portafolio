<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Background prototype</title>
<!-- PROTOTYPE, v5. Not part of the site: a throwaway page to test
     Background as a pitch: wildfire intelligence for the grid, one layer
     per thing you can hire me for. The layers stack the way a real map
     does, imagery at the bottom and the forecast on top, and the list
     reads like a GIS layers panel that checks each one on as it lands.
     Served by `next dev` from /public so it can use the real logos.
     Delete or move before merging. Copy is draft.

     Scroll scrubs one paused anime.js timeline (the stack); small
     anime.js loops inside each layer keep it alive while you read. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>
<style>
  :root {
    --orange: #f5821f; --yellow: #ffc93c; --red: #d92b1c; --maroon: #7a1710; --cream: #fff4de;
    --paper: #fbf3e2; --ink: #3b130f; --muted: #8a6a5c; --rule: rgba(122,23,16,.12); --bar: 48px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; font-size: 11px; }
  .bar { position: sticky; top: 0; z-index: 30; height: var(--bar); display: flex; align-items: center; justify-content: space-between;
         padding: 0 24px; background: var(--maroon); color: var(--cream); }
  .bar a { color: var(--yellow); font-size: 13px; }

  .story { position: relative; height: 340svh; }
  .sticky { position: sticky; top: var(--bar); height: calc(100svh - var(--bar)); display: grid;
            grid-template-columns: minmax(360px, 460px) minmax(0, 1fr); gap: 24px; padding: 0 clamp(24px, 5vw, 72px); align-items: center; }

  /* ── The pitch ───────────────────────────────────────────────────── */
  .kicker { color: var(--red); }
  h1 { font-family: Bungee, sans-serif; font-weight: 400; font-size: clamp(30px, 3.4vw, 44px); line-height: 1; margin: 12px 0 14px; color: var(--maroon); }
  .lede { font-size: 17px; line-height: 1.5; margin: 0; max-width: 38ch; }

  /* The four items, as a GIS layers panel. */
  .panel { margin-top: 28px; background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(59,19,15,.08), 0 0 0 1px var(--rule); overflow: hidden; }
  .panel-head { display: flex; justify-content: space-between; padding: 11px 16px; color: var(--muted); border-bottom: 1px solid var(--rule); }
  .rows { list-style: none; margin: 0; padding: 0; }
  .row { display: grid; grid-template-columns: 16px 1fr 80px; column-gap: 14px; align-items: center; padding: 13px 16px; cursor: pointer; transition: background .35s; }
  .row + .row { border-top: 1px solid var(--rule); }
  .row.on { background: #fff8ea; }
  .check { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid rgba(59,19,15,.35); display: grid; place-items: center; transition: all .25s; }
  .check svg { width: 10px; height: 10px; opacity: 0; transition: opacity .2s; }
  .row.checked .check { background: var(--red); border-color: var(--red); }
  .row.checked .check svg { opacity: 1; }
  .row h3 { margin: 0; font-size: 16px; font-weight: 600; transition: color .3s; }
  .row:not(.checked) h3 { color: var(--muted); }
  .row p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted); max-height: 0; opacity: 0; overflow: hidden; transition: max-height .4s, opacity .3s, margin .4s; }
  .row.on p { max-height: 90px; opacity: 1; margin-top: 4px; }
  .row .logo { width: 80px; height: 30px; display: block; transition: filter .3s, opacity .3s; }
  .row:not(.checked) .logo { filter: grayscale(1); opacity: .35; }
  .row .logo img, .row .logo svg { display: block; width: 100%; height: 100%; object-fit: contain; }
  .close { margin-top: 22px; opacity: 0; transform: translateY(8px); transition: all .4s; pointer-events: none; }
  .close.on { opacity: 1; transform: none; pointer-events: auto; }
  .close a { display: inline-block; background: var(--red); color: #fff; text-decoration: none; font-weight: 600; padding: 12px 22px; border-radius: 8px; }

  /* ── The stack: one map, four layers, drawn isometric ────────────── */
  .stage { position: relative; height: 100%; display: grid; place-items: center; overflow: hidden; }
  .stack { position: relative; width: min(400px, 34vw); aspect-ratio: 1; transform-style: preserve-3d; will-change: transform; }
  .layer { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform, opacity; }
  .layer svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .plate { fill: rgba(255,251,242,.35); stroke: rgba(122,23,16,.28); stroke-width: 1; }
  .layer.dim { filter: saturate(.35) opacity(.75); }
  .tag { position: absolute; left: 100%; top: 0; margin-left: 14px; white-space: nowrap; color: var(--muted); }
  .band-chip { font-family: "Geist Mono", monospace; font-size: 10px; letter-spacing: .08em; }
  .halo { paint-order: stroke; stroke: var(--cream); stroke-width: 3px; stroke-linejoin: round; }

  @media (max-width: 860px) {
    .story { height: 320svh; }
    .sticky { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 0; padding: 12px 16px 16px; align-items: stretch; }
    .pitch { display: contents; }
    .kicker, .lede { display: none; }
    h1 { grid-row: 1; font-size: 24px; margin: 4px 0 0; }
    .stage { grid-row: 2; }
    .panel { grid-row: 3; margin-top: 0; }
    .close { grid-row: 4; margin-top: 12px; }
    .close a { display: block; text-align: center; }
    .row { padding: 10px 14px; grid-template-columns: 16px 1fr 60px; }
    .row h3 { font-size: 15px; }
    .row .logo { width: 60px; height: 24px; }
    .stack { width: min(320px, 58vw, 34svh); }
    .tag { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="bar"><span class="mono">Prototype v5 · Background as a pitch</span><a href="/en#background">← back to the site</a></div>

<section class="story">
  <div class="sticky">
    <div class="pitch">
      <div class="kicker mono">Background</div>
      <h1>Wildfire intelligence for the grid</h1>
      <p class="lede">I build each layer of the map that utilities and fire teams decide on.</p>
      <div class="panel"><div class="panel-head mono"><span>Layers</span><span class="count">0 / 4</span></div><ol class="rows"></ol></div>
      <div class="close"><a href="/en#process">Let's talk</a></div>
    </div>
    <div class="stage"><div class="stack"></div></div>
  </div>
</section>

<script>
const { createTimeline, animate, svg: animeSvg, stagger } = anime;
const C = { cream: "#fff4de", yellow: "#ffc93c", orange: "#f5821f", red: "#d92b1c", maroon: "#7a1710", ink: "#3b130f", sky: "#3f8fb8" };

function fuegoLogo() {
  const g = { W: 34, H: 100, S: 12, GAP: 8, R: 9, r: 4, BAR: 44 };
  const rect = (x, y, w, h, [tl, tr, br, bl] = [0, 0, 0, 0]) => `M${x + tl} ${y}H${x + w - tr}` + (tr ? `A${tr} ${tr} 0 0 1 ${x + w} ${y + tr}` : "") +
    `V${y + h - br}` + (br ? `A${br} ${br} 0 0 1 ${x + w - br} ${y + h}` : "") + `H${x + bl}` + (bl ? `A${bl} ${bl} 0 0 1 ${x} ${y + h - bl}` : "") + `V${y + tl}` + (tl ? `A${tl} ${tl} 0 0 1 ${x + tl} ${y}` : "") + "Z";
  const hole = (x, y, w, h, [tl, tr, br, bl] = [0, 0, 0, 0]) => `M${x + tl} ${y}` + (tl ? `A${tl} ${tl} 0 0 0 ${x} ${y + tl}` : "") + `V${y + h - bl}` + (bl ? `A${bl} ${bl} 0 0 0 ${x + bl} ${y + h}` : "") +
    `H${x + w - br}` + (br ? `A${br} ${br} 0 0 0 ${x + w} ${y + h - br}` : "") + `V${y + tr}` + (tr ? `A${tr} ${tr} 0 0 0 ${x + w - tr} ${y}` : "") + "Z";
  const L = {
    F: (x) => rect(x, 0, g.S, g.H, [g.R, 0, 0, 0]) + rect(x, 0, g.W, g.S, [g.R, 0, 0, 0]) + rect(x, g.BAR, g.W * .82, g.S),
    U: (x) => rect(x, 0, g.W, g.H, [0, 0, g.R, g.R]) + hole(x + g.S, 0, g.W - 2 * g.S, g.H - g.S, [0, 0, g.r, g.r]),
    E: (x) => rect(x, 0, g.S, g.H, [g.R, 0, 0, g.R]) + rect(x, 0, g.W, g.S, [g.R, 0, 0, 0]) + rect(x, g.BAR, g.W * .88, g.S) + rect(x, g.H - g.S, g.W, g.S, [0, 0, 0, g.R]),
    G: (x) => rect(x, 0, g.S, g.H, [g.R, 0, 0, g.R]) + rect(x, 0, g.W, g.S, [g.R, g.R, 0, 0]) + rect(x + g.W - g.S, 0, g.S, g.S + g.H * .1, [0, g.R, 0, 0]) + rect(x, g.H - g.S, g.W, g.S, [0, 0, g.R, g.R]) + rect(x + g.W - g.S, g.BAR, g.S, g.H - g.BAR, [0, 0, g.R, 0]) + rect(x + g.W * .44, g.BAR, g.W * .56, g.S),
    O: (x) => rect(x, 0, g.W, g.H, [g.R, g.R, g.R, g.R]) + hole(x + g.S, g.S, g.W - 2 * g.S, g.H - 2 * g.S, [g.r, g.r, g.r, g.r]),
  };
  const bw = 5 * g.W + 4 * g.GAP + 32, bh = g.H + 28;
  return `<svg viewBox="0 0 ${bw} ${bh}"><rect width="${bw}" height="${bh}" rx="24" fill="#ff5b14"/><g fill="#fff7ec" transform="translate(16 14)">${[..."FUEGO"].map((c, i) => `<path d="${L[c](i * (g.W + g.GAP))}"/>`).join("")}</g></svg>`;
}

// ── What you can hire me for, bottom layer first. Draft copy; no figures. ─
const ITEMS = [
  { title: "Read the land from orbit", tag: "Satellite",
    line: "Turned satellite bands into a clear read of fuel and burn scars for forest teams with no other data.",
    logo: `<img src="/logos/hyticos.png" alt="Hyticos">` },
  { title: "Sense the line before it fails", tag: "Grid",
    line: "Read live sensor streams from power lines and got the real faults to crews the same day.",
    logo: `<img src="/logos/gridware.svg" alt="Gridware">` },
  { title: "See smoke from the right peak", tag: "Cameras",
    line: "Scored camera sites by what they can see, so the network covers the land and the lines.",
    logo: `<img src="/logos/pano-ai.svg" alt="Pano AI">` },
  { title: "Show where the fire goes next", tag: "Forecast",
    line: "Built the public map that turns fire-spread simulations into an hour-by-hour picture anyone can read.",
    logo: fuegoLogo() },
];

const CHECK = `<svg viewBox="0 0 10 10"><path d="M1.5 5.2 4 7.5 8.5 2.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const rowsEl = document.querySelector(".rows");
ITEMS.forEach((it, i) => rowsEl.insertAdjacentHTML("beforeend",
  `<li class="row" data-i="${i}"><span class="check">${CHECK}</span><div><h3>${it.title}</h3><p>${it.line}</p></div><span class="logo">${it.logo}</span></li>`));

// ── The map, one footprint for every layer (400 × 400) ─────────────────
const plate = () => `<rect class="plate" x="0" y="0" width="400" height="400" rx="6"/>`;
const LINE = "40,250 120,222 200,214 268,232 360,206";
const BRANCH = "200,214 214,282 236,348";
const FAULT = [236, 226];
const ign = FAULT, WIND = Math.PI / 4, ECC = .68;
const perim = (s) => "M" + Array.from({ length: 64 }, (_, k) => {
  const a = k / 64 * Math.PI * 2, r = s * (1 - ECC * ECC) / (1 - ECC * Math.cos(a - WIND)) * (1 + .06 * Math.sin(3 * a + 1));
  return `${(ign[0] + r * Math.cos(a)).toFixed(1)} ${(ign[1] + r * Math.sin(a)).toFixed(1)}`;
}).join("L") + "Z";
const poles = LINE.split(" ").concat(BRANCH.split(" ").slice(1)).map((p) => p.split(",").map(Number));

// Satellite imagery as pixels, in three bands: true colour, near-infrared
// (vegetation shows red) and a burn ratio (old scars light up).
const hex = (h) => [1, 3, 5].map((k) => parseInt(h.slice(k, k + 2), 16));
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, k) => Math.round(v + (B[k] - v) * t)).join(",")})`; };
const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
const PX = 20, TILES = [];
for (let y = 0; y < 400; y += PX) for (let x = 0; x < 400; x += PX) {
  const cx = x + PX / 2, cy = y + PX / 2;
  const riverY = 300 + .4 * cx + 16 * Math.sin(cx / 36);
  const water = cx < 280 && Math.abs(cy - riverY) < 11;
  const dx = (cx - 128) / 96, dy = (cy - 112) / 62, d = Math.hypot(dx, dy) * (1 + .12 * Math.sin(Math.atan2(dy, dx) * 4));
  const burn = d < 1 ? 1 - d : 0;
  const veg = Math.min(1, Math.max(0, .55 + .22 * Math.sin(cx / 37 + cy / 53) + .18 * Math.sin(cx / 19 - cy / 29) + (hash(x, y) - .5) * .25));
  TILES.push({ x, y, water, burn, veg });
}
const BANDS = [
  { name: "True color", c: (t) => t.water ? "#6f8f97" : t.burn ? mix("#8f8460", "#4b3b34", Math.min(1, t.burn * 1.6)) : mix("#d8c69c", "#6f7d45", t.veg) },
  { name: "Near-infrared", c: (t) => t.water ? "#24344a" : t.burn ? mix("#a37b72", "#3f434d", Math.min(1, t.burn * 1.6)) : mix("#d4c3a6", "#c4342a", t.veg) },
  { name: "Burn ratio", c: (t) => t.water ? "#e6e1d3" : t.burn ? [C.yellow, C.orange, C.red, C.maroon][Math.min(3, Math.floor(t.burn * 4.2))] : mix("#fbf2dc", "#efe2c3", t.veg) },
];
const bandSvg = (b, i) => `<g ${i ? `clip-path="url(#reveal${i})"` : ""}>${TILES.map((t) => `<rect x="${t.x}" y="${t.y}" width="${PX + .5}" height="${PX + .5}" fill="${b.c(t)}"/>`).join("")}</g>`;

const LAYERS = [
  // 0 · satellite: the land, read in several bands
  `<defs><clipPath id="plateclip"><rect width="400" height="400" rx="6"/></clipPath>
     <clipPath id="reveal1"><rect class="reveal" data-b="1" width="0" height="400"/></clipPath>
     <clipPath id="reveal2"><rect class="reveal" data-b="2" width="0" height="400"/></clipPath></defs>
   <g clip-path="url(#plateclip)">${BANDS.map(bandSvg).join("")}<rect class="scan" x="-4" y="0" width="3" height="400" fill="${C.yellow}"/></g>
   <rect class="plate" x="0" y="0" width="400" height="400" rx="6" style="fill:none"/>
   <g transform="translate(12 12)"><rect width="104" height="20" rx="4" fill="${C.ink}" fill-opacity=".82"/>
     <text class="band-chip" x="10" y="14" fill="${C.cream}">TRUE COLOR</text></g>`,
  // 1 · grid: the lines, and a fault caught on them
  `${plate()}
   <polyline points="${LINE}" fill="none" stroke="${C.cream}" stroke-width="5.5" stroke-linejoin="round"/>
   <polyline points="${BRANCH}" fill="none" stroke="${C.cream}" stroke-width="5.5" stroke-linejoin="round"/>
   <polyline points="${LINE}" fill="none" stroke="${C.ink}" stroke-width="2.2" stroke-linejoin="round"/>
   <polyline points="${BRANCH}" fill="none" stroke="${C.ink}" stroke-width="2.2" stroke-linejoin="round"/>
   <polyline class="current" points="${LINE}" fill="none" stroke="${C.yellow}" stroke-width="2.2" stroke-linejoin="round"/>
   ${poles.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.5" fill="${C.ink}" stroke="${C.cream}" stroke-width="1.5"/>`).join("")}
   <rect x="28" y="238" width="20" height="20" rx="3" fill="${C.ink}"/><path d="M40 241 34 249h5l-2 6 6-8h-5z" fill="${C.yellow}"/>
   <circle class="ping" cx="${FAULT[0]}" cy="${FAULT[1]}" r="6" fill="none" stroke="${C.red}" stroke-width="2"/>
   <circle cx="${FAULT[0]}" cy="${FAULT[1]}" r="5" fill="${C.red}" stroke="${C.cream}" stroke-width="1.5"/>`,
  // 2 · cameras: what each one can see
  `${plate()}
   ${[[140, 104, 20, 100], [318, 84, 70, 160]].map(([x, y, a0, a1], i) => {
     const pts = Array.from({ length: 16 }, (_, k) => { const a = (a0 + (a1 - a0) * k / 15) * Math.PI / 180; return `${x + 190 * Math.cos(a)},${y + 190 * Math.sin(a)}`; });
     return `<path d="M${x},${y}L${pts.join("L")}Z" fill="${C.sky}" fill-opacity=".2" stroke="${C.sky}" stroke-opacity=".7" stroke-width="1.2"/>
       <line class="sweep" data-i="${i}" x1="${x}" y1="${y}" x2="${x + 190}" y2="${y}" stroke="${C.sky}" stroke-width="1.6" style="transform-origin:${x}px ${y}px"/>
       <circle cx="${x}" cy="${y}" r="9" fill="#fff" stroke="${C.ink}" stroke-width="2"/><rect x="${x - 4}" y="${y - 3}" width="8" height="6" fill="${C.ink}"/>`;
   }).join("")}`,
  // 3 · forecast: the fire's edge, hour by hour, with the head marked
  `${plate()}
   ${[30, 52, 74, 96].map((s, i) => `<path class="ring" d="${perim(s)}" fill="${i === 0 ? C.red : "none"}" fill-opacity=".22" stroke="${[C.yellow, C.orange, C.red, C.maroon][i]}" stroke-width="2" stroke-dasharray="${i ? "5 4" : ""}"/>`).join("")}
   ${(() => {
     const heads = [30, 52, 74, 96].map((s) => { const r = s * (1 + ECC); return [ign[0] + r * Math.cos(WIND), ign[1] + r * Math.sin(WIND)]; });
     return `<polyline class="head" points="${[ign, ...heads].map((p) => p.join(",")).join(" ")}" fill="none" stroke="${C.yellow}" stroke-width="1.6"/>` +
       heads.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="3.2" fill="${C.orange}" stroke="${C.cream}" stroke-width="1.2"/><text class="halo" x="${x + 7}" y="${y + 4}" font-family="Geist Mono" font-size="10" fill="${C.ink}">+${i + 1}h</text>`).join("");
   })()}
   <circle cx="${ign[0]}" cy="${ign[1]}" r="4" fill="${C.red}"/>`,
];
const stack = document.querySelector(".stack");
LAYERS.forEach((svg, i) => stack.insertAdjacentHTML("beforeend",
  `<div class="layer" data-i="${i}"><svg viewBox="0 0 400 400">${svg}</svg><span class="tag mono">${ITEMS[i].tag}</span></div>`));
const layers = [...document.querySelectorAll(".layer")];
const plates = layers.map((l) => l.querySelector(".plate"));
const tags = [...document.querySelectorAll(".tag")];

// ── Life inside each layer: small loops, independent of the scroll ─────
// Satellite: a scan line sweeps across and the image changes band behind it.
const chip = document.querySelector(".band-chip");
const setBand = (i) => () => (chip.textContent = BANDS[i].name.toUpperCase());
const wipe = { duration: 1100, ease: "inOutSine" };
createTimeline({ loop: true })
  .add(".scan", { x: [-4, 400], ...wipe }, 1400).add('.reveal[data-b="1"]', { width: [0, 400], ...wipe }, 1400).call(setBand(1), 1950)
  .add(".scan", { x: [-4, 400], ...wipe }, 4000).add('.reveal[data-b="2"]', { width: [0, 400], ...wipe }, 4000).call(setBand(2), 4550)
  .add(".scan", { x: [400, -4], ...wipe }, 6600).add(".reveal", { width: 0, ...wipe }, 6600).call(setBand(0), 7150)
  .add(".scan", { x: -4, duration: 1200 }, 7700);
animate(animeSvg.createDrawable(".current"), { draw: ["0 0", "0 .2", "1 1"], duration: 2400, loop: true, ease: "linear" });
animate(".ping", { r: [6, 22], opacity: [1, 0], duration: 1400, loop: true, ease: "outQuad" });
animate(".sweep", { rotate: (el) => el.dataset.i === "0" ? [20, 100] : [70, 160], duration: 2600, alternate: true, loop: true, ease: "inOutSine" });
animate(animeSvg.createDrawable(".ring"), { draw: ["0 0", "0 1"], duration: 900, delay: stagger(350), loop: true, loopDelay: 1400, ease: "outQuad" });
animate(animeSvg.createDrawable(".head"), { draw: ["0 0", "0 1"], duration: 1800, loop: true, loopDelay: 1000, ease: "inOutQuad" });

// ── The stack, scrubbed by scroll ──────────────────────────────────────
// The imagery is there from the start (chapter 0). k×1000: layer k drops
// on. 3500: it all flattens into one map, seen from straight above.
const S = { d1: 0, d2: 0, d3: 0, flat: 0 };
const tl = createTimeline({ autoplay: false, defaults: { duration: 450, ease: "outCubic" } });
[1, 2, 3].forEach((k) => tl.add(S, { [`d${k}`]: 1 }, k * 1000 + 100));
tl.add(S, { flat: 1, duration: 600, ease: "inOutCubic" }, 3500).add(S, { flat: 1, duration: 1 }, 4299);

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const rows = [...document.querySelectorAll(".row")];
const count = document.querySelector(".count");
let shown = -1, wasDone = null;
function render(time) {
  const ch = Math.min(3, Math.floor(time / 1000));
  const gap = window.innerWidth < 860 ? 40 : 72;
  const f = S.flat, done = f > .5;
  stack.style.transform = `translateY(${(1 - f) * 50}px) rotateX(${58 * (1 - f)}deg) rotateZ(${-42 * (1 - f)}deg) scale(${.92 + .08 * f})`;
  layers.forEach((el, i) => {
    const d = i === 0 ? 1 : S[`d${i}`];
    el.style.transform = `translateZ(${(i * gap) * (1 - f) + (1 - d) * 260}px)`;
    el.style.opacity = d;
    // sheets while stacked; one map once flat
    if (i) { plates[i].style.fillOpacity = 1 - f; plates[i].style.strokeOpacity = 1 - f; }
    // the layer being talked about is the one in full colour
    el.classList.toggle("dim", !done && i !== ch);
  });
  tags.forEach((tg) => (tg.style.opacity = 1 - f));
  if (ch !== shown) {
    rows.forEach((r, i) => {
      const was = r.classList.contains("checked");
      r.classList.toggle("checked", i <= ch);
      // the logo lands with its layer
      if (!was && i <= ch) animate(r.querySelector(".logo"), { scale: [.6, 1], rotate: [-6, 0], duration: 650, ease: "outBack(2)" });
    });
    count.textContent = `${ch + 1} / 4`;
    shown = ch;
  }
  if (done !== wasDone) {
    rows.forEach((r, i) => r.classList.toggle("on", !done && i === ch));
    document.querySelector(".close").classList.toggle("on", done);
    wasDone = done;
  }
  if (!done) rows.forEach((r, i) => r.classList.toggle("on", i === ch));
}

const story = document.querySelector(".story"), sticky = document.querySelector(".sticky");
const progress = () => { const r = story.getBoundingClientRect(); return clamp(-r.top / (r.height - sticky.clientHeight)); };
let t = 0;
function tick() {
  const target = progress() * tl.duration;
  t += (target - t) * .14;
  if (Math.abs(target - t) < .5) t = target;
  tl.seek(t);
  render(t);
  requestAnimationFrame(tick);
}
rows.forEach((r, i) => r.addEventListener("click", () => {
  const rect = story.getBoundingClientRect();
  window.scrollTo({ top: scrollY + rect.top + ((i * 1000 + 650) / tl.duration) * (rect.height - sticky.clientHeight), behavior: "smooth" });
}));
requestAnimationFrame(tick);
</script>
</body>
</html>
