<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story v7 prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Geist:wght@400;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --orange:#f5821f; --maroon:#7a1710; --cream:#fff4de; --yellow:#ffc93c; --red:#d92b1c; --ink:#3b130f; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--orange); color: var(--maroon); font-family: Geist, system-ui, sans-serif; }

  .hero { min-height: 100svh; background: var(--orange); display: grid; place-items: center; text-align: center; padding: 0 24px; }
  .hero h1 { font-family: Bungee, sans-serif; font-weight: 400; color: var(--maroon); font-size: min(19vw, 27svh); line-height: 1.05; letter-spacing: .02em; }
  .hero p { margin-top: 28px; font-size: clamp(18px, 2.2vw, 26px); color: var(--maroon); font-weight: 600; }
  .btn { display: inline-block; margin-top: 28px; padding: 13px 26px; border-radius: 10px; font: 600 16px Geist, sans-serif; border: 0; cursor: pointer; }
  .hero .btn { background: var(--cream); color: var(--maroon); }

  .story { position: relative; height: 760svh; }
  .globe { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; pointer-events: none; }
  /* The orange page stays as a frame; the map is a big card inside it. */
  .stage { position: sticky; top: 0; height: 100svh; padding: clamp(12px, 2.4vw, 36px); }
  .card { position: relative; height: 100%; border-radius: 24px; overflow: hidden; background: #f6f3ee;
          box-shadow: 0 30px 70px -30px rgba(59,19,15,.55); }
  .card svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scrim { position: absolute; inset: auto 0 0 0; height: 42%; pointer-events: none;
           background: linear-gradient(to top, rgba(246,243,238,.96), rgba(246,243,238,.7) 45%, transparent); }

  /* One clock for the whole story: it is one fire, start to finish. */
  .clock { position: absolute; left: clamp(24px, 5vw, 80px); top: clamp(20px, 4svh, 40px);
           font: 500 13px "Geist Mono", monospace; letter-spacing: .06em; color: var(--ink);
           display: flex; align-items: center; gap: 10px; opacity: 0; transition: opacity .4s; }
  .clock.on { opacity: 1; }
  .clock i { width: 7px; height: 7px; border-radius: 50%; background: var(--red); }

  .beat { position: absolute; left: clamp(24px, 5vw, 80px); bottom: clamp(32px, 8svh, 88px);
          opacity: 0; transform: translateY(14px); transition: opacity .5s, transform .5s; pointer-events: none; }
  .beat.on { opacity: 1; transform: none; pointer-events: auto; }
  .beat img { display: block; height: 30px; width: auto; max-width: 140px; object-fit: contain; object-position: left; }
  .beat h2 { margin-top: 14px; font-weight: 600; font-size: clamp(34px, 4.4vw, 64px); line-height: 1; letter-spacing: -.025em; }
  .beat.close h2 { max-width: 14ch; text-wrap: balance; }
  .beat .btn { background: var(--maroon); color: var(--cream); }

  .ticks { position: absolute; right: clamp(18px, 2.4vw, 36px); top: 50%; translate: 0 -50%; display: grid; gap: 10px; }
  .ticks i { display: block; width: 3px; height: 26px; border-radius: 2px; background: rgba(122,23,16,.2); transition: background .3s; }
  .ticks i.on { background: var(--maroon); }
  .notes text { transition: opacity .4s; }
</style>
</head>
<body>

<section class="hero">
  <div>
    <h1>Álvaro<br>Galván</h1>
    <p>I build software for wildfire.</p>
    <button class="btn">Let's build together</button>
  </div>
</section>

<section class="story" id="story">
  <div class="stage"><div class="card">
    <svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" aria-label="One wildfire on a real map: a power line fault, cameras finding the smoke, a fire-spread simulation, and a satellite pass detecting the fire">
      <defs><filter id="mute"><feColorMatrix type="saturate" values="0"/></filter><filter id="soft"><feGaussianBlur stdDeviation="14"/></filter><mask id="feather" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="400"><rect x="18" y="18" width="364" height="364" fill="#fff" filter="url(#soft)"/></mask></defs>
      <g id="world"></g>
    </svg>
    <svg class="globe" aria-hidden="true"><path class="sphere" fill="#fbf9f6" stroke="#3b130f" stroke-opacity=".25"/><path class="grat" fill="none" stroke="#3b130f" stroke-opacity=".08"/><path class="land" fill="#e7e1d8" stroke="#3b130f" stroke-opacity=".3" stroke-width=".6"/><circle class="here-ring" fill="none" stroke="#d92b1c" stroke-width="1.5"/><circle class="here" r="5" fill="#d92b1c"/></svg>
    <div class="scrim"></div>
    <div class="clock"><i></i><span></span></div>

    <div class="beat" data-beat="0"><img src="logos/gridware.svg" alt="Gridware"><h2>Grid sensing</h2></div>
    <div class="beat" data-beat="1"><img src="logos/pano-ai.svg" alt="Pano AI"><h2>Smoke detection</h2></div>
    <div class="beat" data-beat="2"><img src="logos/fuego.svg" alt="FUEGO"><h2>Fire simulation</h2></div>
    <div class="beat" data-beat="3"><img src="logos/hyticos.png" alt="Hyticos"><h2>Remote sensing</h2></div>
    <div class="beat close" data-beat="4"><h2>Let's build a sustainable future together.</h2></div>

    <div class="ticks"><i></i><i></i><i></i><i></i></div>
  </div></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
const C = { cream:"#fff4de", yellow:"#ffc93c", orange:"#f5821f", red:"#d92b1c", maroon:"#7a1710", ink:"#3b130f" };
const INK = C.ink;
const TRANSMISSION = "M43 201L43 217L46 226L43 222M-46 -132L-34 -118L11 -91L37 -86L41 69M24 400L14 398L0 398L-3 401L-2 407L-10 413L-12 411L-12 409L-31 404L-33 403L-47 399L-53 341L-54 268L-91 99L-128 -22L-142 -52L-150 -63L-155 -76L-164 -89L-190 -136L-219 -213L-434 -239L-519 -267L-522 -269L-528 -277M41 69L43 201M39 -21L89 53L98 60L112 118L123 142L122 190M255 771L228 714L175 652L138 632L138 573L135 549L142 509L142 493L131 470L130 438L149 416L149 397L134 372L136 351L145 301L142 288L138 281M128 224L146 221M142 222L149 211L154 207L157 206L165 196";
const FEEDERS = "M122 191L140 205M131 222L140 205M140 205L180 203L225 208L265 196L310 204L355 190L400 196M225 208L240 245L275 262L315 258M265 196L262 160L280 135M310 204L318 165L310 125L322 80M355 190L365 230L392 252M140 205L166 194L186 150L206 101L243 39L262 0M206 101L238 108L272 98L300 70M140 205L150 238L176 268L205 300L238 318M205 300L212 350L224 400";

const P = [314, 184.5];
const SENSORS = [[180,203],[265,196],P,[355,190],[206,101],[176,268],[240,245]];
const deg = r => r * 180 / Math.PI;
const CAMS = [{x:150,y:108,dir:1},{x:372,y:292,dir:-1}].map(c => ({...c, bearing: deg(Math.atan2(P[1]-c.y, P[0]-c.x)), dist: Math.hypot(P[0]-c.x, P[1]-c.y)}));
const FOV = 22, RANGE = 220;
const wedge = c => `M${c.x} ${c.y}L${c.x + RANGE*Math.cos(-FOV*Math.PI/180)} ${c.y + RANGE*Math.sin(-FOV*Math.PI/180)}A${RANGE} ${RANGE} 0 0 1 ${c.x + RANGE*Math.cos(FOV*Math.PI/180)} ${c.y + RANGE*Math.sin(FOV*Math.PI/180)}Z`;

// ---- The fire: a cell-based spread, the way Cell2Fire-style models run ----
// Each cell gets an arrival time from wind (an ellipse leaning north-east)
// times a patchy fuel field. The same cells carry the fire through both the
// close-up and the satellite view, so it is one fire all the way.
const WIND = -Math.PI/4, E = 0.68;
const reach1 = a => ((1-E*E)/(1-E*Math.cos(a-WIND))) * (1 + 0.06*Math.sin(3*a+1));
const hash = (i, j) => { const h = Math.sin(i*127.1 + j*311.7) * 43758.5453; return h - Math.floor(h); };
const sm = x => x*x*(3-2*x);
function noise(x, y) {
  const i = Math.floor(x), j = Math.floor(y), fx = sm(x-i), fy = sm(y-j);
  const a = hash(i,j), b = hash(i+1,j), c = hash(i,j+1), d = hash(i+1,j+1);
  return a + (b-a)*fx + (c-a)*fy + (a-b-c+d)*fx*fy;
}
const fuel = (x, y) => 0.7 + 0.6*noise(x/38, y/38) + 0.25*(noise(x/9 + 50, y/9) - .5);
const arrival = (x, y) => { const dx = x-P[0], dy = y-P[1]; return Math.hypot(dx, dy) / reach1(Math.atan2(dy, dx)) * fuel(x, y); };

const S_CLOSE = 72, S_END = 230, PER_HOUR = 18; // 72 = 4 hours
// The model grid: 2-unit cells (about 25 m), drawn into a small canvas.
const GX = P[0]-220, GY = P[1]-260, GW = 640, GH = 460, CELL = 2;
const NX = GW / CELL, NY = GH / CELL;
const ARR = new Float32Array(NX * NY);
for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) ARR[j*NX + i] = arrival(GX + (i+.5)*CELL, GY + (j+.5)*CELL);
const cvs = Object.assign(document.createElement("canvas"), { width: NX, height: NY });
const ctx = cvs.getContext("2d"), img = ctx.createImageData(NX, NY);
// Burned ground, banded by the hour the fire reached it: an arrival-time map.
const rgb = h => [1,3,5].map(k => parseInt(h.slice(k, k+2), 16));
const BANDS = [[1,"#5e110c"],[2,"#86180f"],[3,"#b02116"],[4,"#d92b1c"],[6,"#e6481e"],[9,"#ef6522"],[99,"#f5821f"]].map(([h, c]) => [h, rgb(c)]);
const band = a => BANDS.find(([h]) => a / PER_HOUR < h)[1];
const FRONT = rgb("#ffb23a");

// Satellite detections: 375 m pixels (about 19 units here) on a fixed grid,
// lit where the pass sees fire still burning.
const PX = 19;
const PIXELS = [];
for (let y = P[1]-260; y < P[1]+200; y += PX) for (let x = P[0]-220; x < P[0]+420; x += PX) {
  const a = arrival(x + PX/2, y + PX/2);
  if (a <= S_END) PIXELS.push({x, y, a});
}

const NS = 'vector-effect="non-scaling-stroke"';
const world = document.getElementById("world");
// Light basemap: the photos in greyscale, washed toward paper, so the only
// strong colour on the map is the fire.
world.innerHTML = `
  <image href="maps/grass-valley-wide-s2-2016.webp" x="-800" y="-800" width="2000" height="2000" filter="url(#mute)"/>
  <rect x="-800" y="-800" width="2000" height="2000" fill="#f6f3ee" opacity=".74"/>
  <g class="near" mask="url(#feather)"><image href="maps/grass-valley-naip.webp" width="400" height="400" filter="url(#mute)"/><rect width="400" height="400" fill="#f6f3ee" opacity=".66"/></g>
  <g class="grid" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="${TRANSMISSION}" stroke="${INK}" stroke-width="1.8" stroke-opacity=".6" ${NS}/>
    <path d="${FEEDERS}" stroke="${INK}" stroke-width="1" stroke-opacity=".45" ${NS}/>
    <path class="faulted" d="M310 204L318 165" stroke="${C.red}" stroke-width="3" opacity="0" ${NS}/>
  </g>
  <image class="sim" x="${GX}" y="${GY}" width="${GW}" height="${GH}" preserveAspectRatio="none"/>
  <g class="swath" opacity="0">
    <rect x="-130" y="-1400" width="260" height="2800" fill="${C.maroon}" fill-opacity=".05"/>
    <line x1="-130" y1="-1400" x2="-130" y2="1400" stroke="${C.maroon}" stroke-opacity=".45" stroke-width="1" stroke-dasharray="6 5" ${NS}/>
    <line x1="130" y1="-1400" x2="130" y2="1400" stroke="${C.maroon}" stroke-opacity=".45" stroke-width="1" stroke-dasharray="6 5" ${NS}/>
  </g>
  <g class="pixels" fill="none" stroke="${C.maroon}" stroke-width="1.1" ${NS}>${PIXELS.map(p => `<rect x="${p.x+1}" y="${p.y+1}" width="${PX-2}" height="${PX-2}" opacity="0" ${NS}/>`).join("")}</g>
  <g class="views" opacity="0">${CAMS.map(c => `<path class="fov" d="${wedge(c)}" fill="${C.maroon}" fill-opacity=".07" stroke="${C.maroon}" stroke-opacity=".35" stroke-width="1" ${NS}/>`).join("")}</g>
  <g class="bearings">${CAMS.map(c => `<line x1="${c.x}" y1="${c.y}" x2="${P[0]}" y2="${P[1]}" pathLength="1" stroke="${C.maroon}" stroke-width="1.2" stroke-dasharray="1 1" stroke-dashoffset="1"/>`).join("")}</g>
  <g class="kit">
    ${SENSORS.map(([x, y], i) => `<circle class="sensor${i === 2 ? " hit" : ""}" cx="${x}" cy="${y}" r="1.7" fill="#fff" stroke="${INK}" stroke-width="1.2" ${NS}/>`).join("")}
    <circle class="ping" cx="${P[0]}" cy="${P[1]}" r="3" fill="none" stroke="${C.red}" stroke-width="2" ${NS}/>
    <circle class="ping" cx="${P[0]}" cy="${P[1]}" r="3" fill="none" stroke="${C.red}" stroke-width="2" ${NS}/>
    ${CAMS.map(c => `<g transform="translate(${c.x} ${c.y})"><circle r="5.5" fill="${INK}"/><circle r="2" fill="#fff"/></g>`).join("")}
  </g>
  <g class="smoke" opacity="0">${[0,1,2,3].map(k => `<circle cx="${P[0]+3+k*5}" cy="${P[1]-6-k*7}" r="${4+k*2.8}" fill="#8f8780" fill-opacity="${.55-k*.11}"/>`).join("")}</g>
  <g class="notes" font-family="'Geist Mono', monospace" fill="${INK}" letter-spacing=".04em">
    <text opacity="0" data-on="0" x="186" y="216">Power line</text>
    <text opacity="0" data-on="0" x="258" y="190" text-anchor="end">Line sensor</text>
    <text opacity="0" data-on="0" x="322" y="182" fill="${C.red}">Fault</text>
    <text opacity="0" data-on="1" x="141" y="104" text-anchor="end">Camera</text>
    <text opacity="0" data-on="1" x="363" y="304" text-anchor="end">Camera</text>
    <text opacity="0" data-on="1" x="332" y="152">Smoke</text>
    <text opacity="0" data-on="2" x="296" y="214" text-anchor="end">Ignition</text>
    <text opacity="0" data-on="2" class="front-note" fill="${C.red}">Fire front</text>
    <text opacity="0" data-on="3" class="pass-note">Satellite pass</text>
    <text opacity="0" data-on="3" x="${P[0]-50}" y="${P[1]+100}" text-anchor="end">Fire detections</text>
  </g>`;

const $ = s => world.querySelector(s), $$ = s => [...world.querySelectorAll(s)];
const near = $(".near"), grid = $(".grid"), kit = $(".kit"), views = $(".views"), smoke = $(".smoke"), hit = $(".sensor.hit"), faulted = $(".faulted");
const pings = $$(".ping"), sweeps = $$(".fov"), bearings = $$(".bearings line"), bearingsG = $(".bearings");
const sim = $(".sim"), pixEls = $$(".pixels rect"), swath = $(".swath");
const notes = $$(".notes text"), notesG = $(".notes"), frontNote = $(".front-note"), passNote = $(".pass-note");
const smokeCircles = $$(".smoke circle");
const beats = [...document.querySelectorAll("[data-beat]")], ticks = [...document.querySelectorAll(".ticks i")];
const clockEl = document.querySelector(".clock"), clockText = clockEl.querySelector("span");
const svgEl = world.ownerSVGElement;

// ---- The close: keep pulling back until the fire is a dot on the Earth ----
// The globe is centred on the story's place (Grass Valley, California) and
// starts at the same scale as the satellite view, so the zoom never cuts.
const HERE = [-121.06, 39.22];
const globeEl = document.querySelector(".globe"), proj = d3.geoOrthographic().rotate([-HERE[0], -HERE[1]]).precision(.3);
const gpath = d3.geoPath(proj), grat = d3.geoGraticule10();
const sphereEl = globeEl.querySelector(".sphere"), gratEl = globeEl.querySelector(".grat"), landEl = globeEl.querySelector(".land");
const hereEl = globeEl.querySelector(".here"), ringEl = globeEl.querySelector(".here-ring");
let LAND = null;
fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json").then(r => r.json()).then(w => { LAND = topojson.feature(w, w.objects.land); });
const T_EARTH = 4000, EARTH_DUR = 800;

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
const ramp = (t, start, dur) => ease(clamp((t - start) / dur));

// The camera: [time, zoom, centre x, centre y]. 1000 per beat.
const CAM = [
  [0, 1.9, 300, 190], [800, 1.9, 305, 188],
  [1150, 1, 200, 198], [2000, 1, 200, 198],
  [2250, 1.05, 315, 160], [3000, 1.05, 315, 160],
  [3400, .3, 330, 150], [6000, .3, 330, 150],
];
function camera(t) {
  const i = CAM.findIndex(k => k[0] > t);
  if (i === -1) return CAM.at(-1).slice(1);
  if (i === 0) return CAM[0].slice(1);
  const a = CAM[i-1], b = CAM[i], f = ease((t - a[0]) / (b[0] - a[0]));
  return [1, 2, 3].map(j => a[j] + (b[j] - a[j]) * f);
}

// How far the fire has run, in arrival units: 0 to 4 h in the simulation
// beat, then on to the next morning while the satellite passes.
const T_GROW = 3300, T_PASS = 3350, PASS_DUR = 600;
const simS = t => t < 2150 ? -1 : t < 2950 ? S_CLOSE * clamp((t - 2150) / 800)
  : t < T_GROW ? S_CLOSE : S_CLOSE + (S_END - S_CLOSE) * clamp((t - T_GROW) / 650);
// The satellite pass sweeps west to east across the fire.
const passX = t => P[0] - 520 + 1000 * clamp((t - T_PASS) / PASS_DUR);

function clock(t, s) {
  let mins = 14*60 + 2;
  if (t >= 1000) mins += 6;
  if (s > 0) mins += s / PER_HOUR * 60;
  const day = 1 + Math.floor(mins / 1440), m = Math.round(mins % 1440);
  return `DAY ${day}  ${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
}

let shown = -1, lastS = null, lastPass = null;
function render(t, now) {
  const S = { fault: ramp(t, 200, 300), cams: ramp(t, 1150, 450), bear: ramp(t, 1550, 300), smoke: ramp(t, 1800, 250),
              spread: clamp((t - 2150) / 800), zoom: ramp(t, 2980, 420) };
  let [z, cx, cy] = camera(t);
  // Past the satellite view, both layers zoom out at the same rate: the map
  // shrinks away while the globe arrives at the scale it is leaving.
  const g = ease(clamp((t - T_EARTH) / EARTH_DUR));
  const W = svgEl.clientWidth, H = svgEl.clientHeight;
  const mPerPx = 5 * 1609 / (Math.max(W, H) / 400 * .3) / 400; // metres per pixel at z = .3
  const k0 = 6371000 / mPerPx, k1 = .36 * Math.min(W, H), k = k0 * Math.pow(k1 / k0, g);
  z *= k / k0;
  world.setAttribute("transform", `translate(200 200) scale(${z}) translate(${-cx} ${-cy})`);
  // Labels stay 12px on screen whatever the zoom.
  const unit = Math.max(svgEl.clientWidth, svgEl.clientHeight) / 400 * z;
  notesG.setAttribute("font-size", 12 / unit);
  const beat = Math.min(4, Math.floor(t / 1000));
  notes.forEach(n => n.setAttribute("opacity", +n.dataset.on === beat && t % 1000 > 200 && t % 1000 < 920 ? 1 : 0));

  // 1. Grid sensing
  hit.setAttribute("fill", S.fault > .5 ? C.red : "#fff");
  hit.setAttribute("r", 1.7 + 1.3 * S.fault);
  faulted.setAttribute("opacity", S.fault * (1 - S.spread));
  pings.forEach((p, i) => {
    const ph = ((now / 1400) + i / 2) % 1;
    p.setAttribute("r", 3 + 22 * ph);
    p.setAttribute("opacity", S.fault * (1 - ph) * (1 - S.cams));
  });

  // 2. Smoke detection
  CAMS.forEach((c, i) => {
    const amb = (c.bearing + 120 + c.dir * now * 0.04) % 360;
    const diff = ((c.bearing - amb + 540) % 360) - 180;
    sweeps[i].setAttribute("transform", `rotate(${amb + diff * S.cams} ${c.x} ${c.y})`);
    bearings[i].setAttribute("stroke-dashoffset", 1 - S.bear);
  });
  views.setAttribute("opacity", Math.min(1, .25 + S.cams) * clamp((t - 900) / 250) * (1 - S.spread));
  bearingsG.setAttribute("opacity", 1 - clamp(S.spread * 3));
  smoke.setAttribute("opacity", S.smoke * (1 - clamp(S.spread * 2)));
  smokeCircles.forEach((c, k) => c.setAttribute("transform", `translate(0 ${-4 * Math.sin(now / 900 + k)})`));

  // 3. Fire simulation: cells ignite in arrival order; the front burns
  // bright, then settles into its hour colour.
  const s = simS(t);
  if (s !== lastS) {
    lastS = s;
    const w = 3 + .05 * Math.max(0, s), d = img.data;
    for (let k = 0; k < ARR.length; k++) {
      const a = ARR[k], o = k * 4;
      if (s < 0 || a > s) { d[o+3] = 0; continue; }
      const c = s - a < w ? FRONT : band(a);
      d[o] = c[0]; d[o+1] = c[1]; d[o+2] = c[2]; d[o+3] = s - a < w ? 255 : 190;
    }
    ctx.putImageData(img, 0, 0);
    sim.setAttribute("href", cvs.toDataURL());
    // Park the "Fire front" label just ahead of the head of the fire.
    const r = Math.max(10, s) * reach1(WIND) * 1.05 + 8;
    frontNote.setAttribute("x", (P[0] + r * Math.cos(WIND)).toFixed(1));
    frontNote.setAttribute("y", (P[1] + r * Math.sin(WIND)).toFixed(1));
  }

  // 4. Remote sensing: a pass crosses the same fire and lights the pixels
  // that are still burning when it goes over.
  const px = passX(t);
  swath.setAttribute("opacity", clamp((t - T_PASS + 100) / 120) * (1 - clamp((t - T_PASS - PASS_DUR) / 120)));
  swath.setAttribute("transform", `translate(${px} 0)`);
  passNote.setAttribute("x", px + 136);
  passNote.setAttribute("y", P[1] - 230);
  if (px !== lastPass) {
    lastPass = px;
    pixEls.forEach((el, i) => {
      const p = PIXELS[i], cxp = p.x + PX/2;
      let on = false;
      if (t >= T_PASS && cxp <= px) {
        // when the pass was over this pixel, was it burning?
        const tp = T_PASS + PASS_DUR * clamp((cxp - (P[0] - 520)) / 1000);
        const sp = simS(tp);
        on = p.a <= sp && sp - p.a < 28;
      }
      el.setAttribute("opacity", on ? .85 : 0);
    });
  }

  near.setAttribute("opacity", 1 - clamp((S.zoom - .3) / .5));
  kit.setAttribute("opacity", 1 - clamp(S.zoom / .4));
  grid.setAttribute("opacity", 1 - .6 * clamp(S.zoom / .7));

  world.parentNode.style.opacity = 1 - clamp((g - .08) / .22);
  globeEl.style.opacity = clamp((g - .02) / .2);
  if (t > T_EARTH - 50) {
    const end = [Math.max(W/2, Math.min(W * .66, W - k1 - 32)), H * .42];
    proj.scale(k).translate([W/2 + (end[0] - W/2) * g, H/2 + (end[1] - H/2) * g]);
    sphereEl.setAttribute("d", gpath({type: "Sphere"}));
    gratEl.setAttribute("d", gpath(grat));
    if (LAND) landEl.setAttribute("d", gpath(LAND));
    const [hx, hy] = proj(HERE);
    hereEl.setAttribute("cx", hx); hereEl.setAttribute("cy", hy);
    const ph = (now / 1600) % 1;
    ringEl.setAttribute("cx", hx); ringEl.setAttribute("cy", hy);
    ringEl.setAttribute("r", 5 + 22 * ph); ringEl.setAttribute("opacity", (1 - ph) * g);
  }
  clockEl.classList.toggle("on", t > 150 && t < T_EARTH + 200);
  clockText.textContent = clock(t, s);

  if (beat !== shown) {
    shown = beat;
    beats.forEach((b, i) => b.classList.toggle("on", i === beat));
    ticks.forEach((k, i) => k.classList.toggle("on", i === Math.min(beat, 3)));
  }
}

const section = document.getElementById("story");
const DUR = 6000;
const progress = () => { const r = section.getBoundingClientRect(); return clamp(-r.top / (r.height - innerHeight)); };
let t = 0;
(function tick(now) {
  const target = progress() * DUR;
  t += (target - t) * .12;
  if (location.hash === "#snap" || Math.abs(target - t) < .5) t = target;
  render(t, now);
  requestAnimationFrame(tick);
})(0);
</script>
</body>
